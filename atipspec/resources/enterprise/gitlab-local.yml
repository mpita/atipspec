# Include from .gitlab-ci.yml and require the pipeline to succeed before merge.
# Set ATIPSPEC_PACKAGE to an immutable wheel or a pinned released version.
# The job runs no command from the candidate and holds no credentials: it reads
# the merge request's source head and its git history. Nothing may write into
# the checkout before merge-check, which judges the committed head. Run the
# project's tests in their own job. With `trust: required` in
# .atipspec/config.yaml this job fails closed: run `merge-check --policy` on
# the protected worker instead. A merge request runs the .gitlab-ci.yml of its
# source branch, so the branch can remove this job: enforce it from outside the
# candidate, with a pipeline execution policy or a compliance pipeline.
# merge-check fails on code a branch changes outside .atipspec/ that no delivery
# of the branch changed after its base commit, unless exempt_paths in the
# target branch's .atipspec/config.yaml matches it: list there the files no
# delivery needs to govern, such as "docs/**". The include that adds this job
# is such code: merge the merge request that adds it before you require the
# pipeline.
atipspec-merge-check:
  image: python:3.12
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - test -n "$ATIPSPEC_PACKAGE"
    # Outside the checkout and isolated (-I): a pip/ or a wheel the candidate commits is never loaded.
    - (cd "$(mktemp -d)" && python -I -m pip install "$ATIPSPEC_PACKAGE")
    # The target branch's tip: its `trust: required` applies even to a branch forked before it, and its exempt_paths.
    - git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # The source head, not a merged-results commit: an acceptance binds the head's code.
    - git checkout --detach "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - python -I -m atipspec merge-check --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
