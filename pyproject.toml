[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atipspec"
version = "0.2.0"
description = "Spec-driven delivery for LLM coding clients, with a deterministic gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Manuel Pita" }]
keywords = ["specifications", "spec-driven", "llm", "agents", "claude-code", "codex", "cursor", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://mpita.github.io/atipspec/"
Documentation = "https://mpita.github.io/atipspec/"
Repository = "https://github.com/mpita/atipspec"
Issues = "https://github.com/mpita/atipspec/issues"

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.3"]

[project.scripts]
atipspec = "atipspec.cli:main"

[tool.setuptools]
packages = ["atipspec"]

[tool.setuptools.package-data]
atipspec = [
    "resources/skills/*/SKILL.md",
    "resources/framework/*.md",
    "resources/framework/workflows/*.md",
    "resources/framework/templates/*.md",
    "resources/enterprise/*",
]

[tool.uv]
# Rebuild when any source or resource changes, not only pyproject.toml, so
# `uv tool install .` never serves a stale cached wheel.
cache-keys = [{ file = "pyproject.toml" }, { file = "atipspec/**/*" }]
