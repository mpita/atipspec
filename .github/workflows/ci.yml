name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Every git and Python process starts slower on Windows: the suite runs
    # there in parallel processes and has more time.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          # Windows runs with its ANSI code page, not UTF-8 mode: the suite and the
          # smoke test prove that AtipSpec names its encodings.
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from checkout (non-editable, exercises package data)
        run: python -m pip install .
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -t . -v
      - name: Run tests, one process per module
        if: runner.os == 'Windows'
        run: python scripts/run_tests.py --jobs 4
      - name: Exercise the installed CLI through a whole change
        run: python scripts/smoke_test.py
      - name: Check whitespace
        if: runner.os == 'Linux'
        run: git diff --check

  windows-text:
    # Windows writes text with CRLF where no newline is named. The suite runs
    # that way on Linux too, so a line-ending failure shows without a Windows runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install from checkout (non-editable, exercises package data)
        run: python -m pip install .
      - name: Run tests with Windows text mode
        run: python -m tests.windows_text -v
